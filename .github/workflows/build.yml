name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libdbus-1-dev \
            libpipewire-0.3-dev libwayland-dev libwayland-bin \
            libx11-dev libxext-dev libxfixes-dev
      - name: Build
        run: |
          meson setup build
          ninja -C build
